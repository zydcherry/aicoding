spring:
  application:
    name: push-system

  # 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/push_system?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: your_password
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  # Kafka配置
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      batch-size: 16384
      linger-ms: 10
    consumer:
      group-id: push-consumer-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 10

  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

  # Redis配置
  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

  # Cache配置
  cache:
    type: redis
    redis:
      time-to-live: 600000  # 默认缓存时间10分钟
      cache-null-values: false

# 服务器配置
server:
  port: 8080

# 日志配置
logging:
  level:
    com.push.system: INFO
    org.apache.kafka: WARN
    org.springframework.kafka: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.push.system.entity
  configuration:
    map-underscore-to-camel-case: true

# 推送系统配置
push:
  system:
    # 队列容量
    queue-capacity: 10000
    # 工作线程数
    worker-thread-count: 10
    # 轮询超时时间（秒）
    poll-timeout-seconds: 3
    # 默认最大重试次数
    default-max-retry: 3

  # Kafka Topic配置
  kafka:
    topics:
      # 内部推送消息topic（API发送到Kafka）
      push-message: push-message-topic
      # 外部推送消息topic（直接消费Kafka）
      external-push: external-push-topic
      # 内部高优先级消息topic
      push-high-priority: push-high-priority
      # 内部普通优先级消息topic
      push-normal-priority: push-normal-priority
      # 内部低优先级消息topic
      push-low-priority: push-low-priority

  # HTTP客户端配置
  http:
    # 默认连接超时（毫秒）
    default-connect-timeout: 3000
    # 默认读取超时（毫秒）
    default-read-timeout: 5000
    # 默认最大重试次数
    default-max-retry: 3

  # 订阅配置
  subscription:
    # 是否启动时加载示例数据
    load-sample-data: true
    # 事件类型索引初始容量
    event-type-index-initial-capacity: 100
